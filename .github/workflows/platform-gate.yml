name: Platform Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run platform policy tests
        run: |
          python -m pytest platform/test_policy_gates.py -q
      - name: Security gate
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit || true
      - name: Evidence gate
        run: |
          test -f platform/CONTRACT-VERIFICATION.md
          test -f docs/AIPUSULA-PLATFORM-INTEGRATION.md
