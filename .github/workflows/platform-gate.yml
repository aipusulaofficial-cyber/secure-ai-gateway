name: Platform Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run platform policy tests
        env:
          PYTHONPATH: platform
        run: python -m pytest platform/test_policy_gates.py -q
      - name: Security gate
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit
      - name: Evidence gate
        run: |
          test -f platform/CONTRACT-VERIFICATION.md
          test -f docs/AIPUSULA-PLATFORM-INTEGRATION.md