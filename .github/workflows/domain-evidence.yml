name: Domain Executable Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Execute gateway domain evidence
        run: |
          set -o pipefail
          mkdir -p artifacts
          python benchmarks/gateway_evidence.py | tee artifacts/gateway-evidence.json
      - name: Validate evidence JSON
        run: python -m json.tool artifacts/gateway-evidence.json >/dev/null
      - name: Upload domain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-domain-evidence
          path: artifacts/gateway-evidence.json
          if-no-files-found: error
