name: Benchmark And Reliability Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Failure injection tests
        run: python -m pytest reliability/test_failure_injection.py -q
      - name: Benchmark harness
        run: |
          mkdir -p artifacts
          python benchmarks/run_benchmark.py --iterations 1000 | tee artifacts/benchmark.json
      - name: Upload measured evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: artifacts/benchmark.json