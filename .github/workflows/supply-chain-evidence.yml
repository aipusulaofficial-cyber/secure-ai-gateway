name: Supply Chain Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Dependency audit
        shell: bash
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install --disable-pip-version-check pip-audit
            python -m pip_audit
          else
            echo "No Python dependency manifest detected; dependency audit is not applicable."
          fi
      - name: Secret pattern gate
        shell: bash
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})' . --exclude-dir=.git --exclude-dir=.github
      - name: Evidence files
        run: |
          test -f docs/SUPPLY-CHAIN-BENCHMARK-RELIABILITY.md
          test -f benchmarks/README.md
          test -f reliability/SLO-FAILURE-MATRIX.md