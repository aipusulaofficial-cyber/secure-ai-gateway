apiVersion: apps/v1
kind: Deployment
metadata: {name: secure-ai-gateway}
spec:
 replicas: 2
 selector: {matchLabels: {app: secure-ai-gateway}}
 template:
  metadata: {labels: {app: secure-ai-gateway}}
  spec:
   containers:
   - name: api
     image: secure-ai-gateway:latest
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
     livenessProbe: {httpGet: {path: /health/live, port: 8000}}
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
